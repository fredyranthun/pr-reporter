name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd/pr-report)"
      - name: Test without GitHub access
        run: GOPROXY=off GOTOOLCHAIN=local go test ./...
      - name: Check concurrency races
        run: GOPROXY=off GOTOOLCHAIN=local go test -race ./...
      - name: Build command
        run: GOPROXY=off GOTOOLCHAIN=local go build -o pr-report ./cmd/pr-report
